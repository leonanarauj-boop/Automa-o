name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: retoma
          POSTGRES_PASSWORD: retoma
          POSTGRES_DB: retoma_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U retoma" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      TEST_DATABASE_URL: postgres://retoma:retoma@localhost:5432/retoma_test
      E2E_DATABASE_URL: postgres://retoma:retoma@localhost:5432/retoma_e2e
      DATABASE_URL: postgres://retoma:retoma@localhost:5432/retoma_e2e
      ENCRYPTION_KEY: MDEyMzQ1Njc4OWFiY2RlZjAxMjM0NTY3ODlhYmNkZWY=
      APP_URL: http://localhost:3100
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - name: Testes unitários e de integração (inclui isolamento entre empresas)
        run: npm test
      - name: Banco do teste de ponta a ponta
        run: |
          PGPASSWORD=retoma psql -h localhost -U retoma -d retoma_test -c "create database retoma_e2e"
          npm run db:migrate -- "$E2E_DATABASE_URL"
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - name: Teste de ponta a ponta
        run: npm run test:e2e
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-results
          path: test-results/
