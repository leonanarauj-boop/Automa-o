# Banco local para desenvolvimento e testes: docker compose up -d
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: retoma
      POSTGRES_PASSWORD: retoma
      POSTGRES_DB: retoma_dev
    ports: ["5432:5432"]
    volumes: ["retoma-db:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U retoma"]
      interval: 3s
      retries: 20
volumes:
  retoma-db:
